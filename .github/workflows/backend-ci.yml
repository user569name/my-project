name: Backend CI

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, tests and image build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tarot
          POSTGRES_PASSWORD: tarot
          POSTGRES_DB: tarot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tarot -d tarot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://tarot:tarot@localhost:5432/tarot_test
      SECRET_KEY: ci-secret-key-with-enough-length

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests against PostgreSQL
        run: pytest -q

      - name: Check Alembic migrations
        env:
          DATABASE_URL: postgresql+asyncpg://tarot:tarot@localhost:5432/tarot_test
        run: |
          alembic upgrade head
          alembic downgrade base

      - name: Build Docker image
        working-directory: .
        run: docker build -t mystic-tarot-backend:ci ./backend

      - name: Smoke test the container
        working-directory: .
        run: |
          docker network create tarot-ci
          docker run -d --name tarot-db --network tarot-ci \
            -e POSTGRES_USER=tarot -e POSTGRES_PASSWORD=tarot -e POSTGRES_DB=tarot \
            postgres:18-alpine
          for i in $(seq 1 30); do
            docker exec tarot-db pg_isready -U tarot -d tarot && break
            sleep 2
          done
          docker run -d --name tarot-api --network tarot-ci \
            -e DATABASE_URL=postgresql+asyncpg://tarot:tarot@tarot-db:5432/tarot \
            -e SECRET_KEY=ci-secret-key-with-enough-length \
            -p 8000:8000 mystic-tarot-backend:ci
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "API did not become healthy" >&2
          docker logs tarot-api
          exit 1

      - name: Container logs on failure
        if: failure()
        working-directory: .
        run: docker logs tarot-api || true
