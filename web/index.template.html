<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mystic Tarot — карты знают больше</title>
<style>
  :root {
    --bg: #14121f;
    --bg-card: #1d1a2b;
    --bg-card-2: #241f33;
    --border: rgba(216, 180, 106, 0.35);
    --gold: #d8b46a;
    --gold-bright: #e8c87c;
    --text: #efe9dc;
    --text-dim: #9b93ab;
    --danger: #d98a8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #2a2440 0%, var(--bg) 55%) fixed, var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 56px; }
  .starfield::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 60% 15%, rgba(255,255,255,.25) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 80% 60%, rgba(255,255,255,.3) 50%, transparent 51%),
      radial-gradient(1px 1px at 35% 75%, rgba(255,255,255,.2) 50%, transparent 51%),
      radial-gradient(1px 1px at 90% 25%, rgba(255,255,255,.2) 50%, transparent 51%),
      radial-gradient(1px 1px at 10% 55%, rgba(255,255,255,.25) 50%, transparent 51%);
  }
  header.bar {
    display: flex; justify-content: space-between; align-items: center; margin: 8px 0 4px;
  }
  header.bar .logo-small {
    font-family: Georgia, serif; font-size: 22px; color: var(--gold-bright);
  }
  header.bar .who { color: var(--text-dim); font-size: 13px; }
  .sparkle { text-align: center; font-size: 34px; margin-top: 22px; filter: drop-shadow(0 0 12px rgba(232,200,124,.6)); }
  h1.logo {
    font-family: Georgia, "Times New Roman", serif;
    text-align: center; font-size: 40px; font-weight: 500;
    color: var(--gold-bright); letter-spacing: 0.5px; margin-top: 8px;
  }
  .tagline { text-align: center; color: var(--text-dim); margin: 6px 0 30px; }
  h2 { font-family: Georgia, serif; font-size: 26px; margin: 18px 0 4px; }
  .sub { color: var(--text-dim); margin-bottom: 12px; }
  .panel {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 18px; padding: 20px; margin-bottom: 18px;
  }
  label { display: block; font-size: 13px; color: var(--text-dim); margin: 12px 2px 6px; }
  textarea {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; font-size: 15px; outline: none;
    resize: vertical; min-height: 84px;
  }
  textarea:focus { border-color: var(--gold); }
  .hint { font-size: 12px; color: var(--text-dim); margin: 5px 4px; }
  .btn-main {
    width: 100%; margin-top: 16px; padding: 13px; font-size: 16px; font-weight: 600;
    background: linear-gradient(180deg, var(--gold-bright), #c9a355);
    border: none; border-radius: 999px; color: #35290f; cursor: pointer;
    transition: filter .15s;
  }
  .btn-main:hover { filter: brightness(1.07); }
  .btn-main:disabled { filter: grayscale(.5) brightness(.7); cursor: default; }
  .error { color: var(--danger); font-size: 14px; margin-top: 10px; text-align: center; min-height: 18px; }
  .spread { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
  .spread label.radio {
    display: flex; gap: 12px; align-items: center; cursor: pointer;
    background: var(--bg-card-2); border: 1px solid var(--border);
    border-radius: 14px; padding: 13px 15px; margin: 0;
    transition: border-color .15s, background .15s;
  }
  .spread label.radio:hover { border-color: var(--gold); }
  .spread label.radio.checked { background: rgba(216,180,106,.12); border-color: var(--gold); }
  .dot {
    width: 20px; height: 20px; border-radius: 50%; flex: none;
    border: 2px solid var(--gold); position: relative;
  }
  .spread label.radio.checked .dot::after {
    content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--gold);
  }
  .spread b { font-size: 15px; }
  .spread small { display: block; color: var(--text-dim); font-weight: 400; }
  .cards { display: grid; gap: 12px; margin-top: 10px; }
  .cards.c1 { grid-template-columns: minmax(0, 1fr); }
  .cards.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cards.c10 { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  .card {
    background: linear-gradient(180deg, #26202440, #0000), var(--bg-card-2);
    border: 1px solid var(--border); border-radius: 14px; padding: 12px; text-align: center;
  }
  .card .sym { font-size: 30px; filter: drop-shadow(0 0 8px rgba(232,200,124,.5)); }
  .card .nm { font-family: Georgia, serif; margin-top: 6px; font-size: 14px; line-height: 1.25; }
  .card .pos { color: var(--text-dim); font-size: 11.5px; margin-top: 4px; }
  .card .rev { color: var(--danger); font-size: 11.5px; margin-top: 2px; }
  .card .mean { margin-top: 8px; font-size: 12.5px; color: var(--text); text-align: left; line-height: 1.45; }
  .card .kw { margin-top: 6px; font-size: 11px; color: var(--text-dim); }
  .reading-meta { color: var(--text-dim); font-size: 13px; margin: 4px 0 8px; }
  .q { font-family: Georgia, serif; font-size: 15px; color: var(--gold-bright); margin: 8px 0; white-space: pre-wrap; }
  .history-item {
    background: var(--bg-card-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px; cursor: pointer; transition: border-color .15s;
  }
  .history-item:hover { border-color: var(--gold); }
  .history-item .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .history-item .who2 { font-family: Georgia, serif; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history-item .when { color: var(--text-dim); font-size: 12px; flex: none; }
  .history-item small { color: var(--text-dim); }
  .badge {
    display: inline-block; border: 1px solid var(--border); color: var(--gold);
    border-radius: 999px; font-size: 12px; padding: 2px 10px; margin-left: 8px; vertical-align: middle;
  }
  footer { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 40px; }
  @media (max-width: 560px) {
    .cards.c3 { grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
    h1.logo { font-size: 32px; }
  }
</style>
</head>
<body class="starfield">
<div class="wrap" id="app">

  <header class="bar">
    <span class="logo-small">Mystic Tarot</span>
    <span class="who">локальные расклады</span>
  </header>

  <div class="sparkle">✦</div>
  <h1 class="logo">Mystic Tarot</h1>
  <p class="tagline">Карты знают больше, чем кажется</p>

  <h2>Привет, путник</h2>
  <p class="sub">Сформулируйте вопрос — и позвольте картам ответить.</p>

  <div class="panel">
    <label for="f-question">Ваш вопрос</label>
    <textarea id="f-question" maxlength="500" placeholder="О чём вы хотите спросить карты?"></textarea>
    <div class="hint"><span id="q-count">0</span>/500</div>

    <div style="margin-top:14px;font-size:14px;color:var(--text-dim)">Выберите расклад</div>
    <div class="spread" id="spreads"></div>
    <button id="btn-draw" class="btn-main" type="button">★ Открыть карты</button>
    <div class="error" id="draw-error"></div>
  </div>

  <div id="result-box"></div>

  <h2>История</h2>
  <p class="sub">Расклады хранятся в этом браузере</p>
  <div id="history"></div>

  <footer>Mystic Tarot · расклады носят развлекательный характер</footer>
</div>

<script>
(function () {
  "use strict";
  const SPREADS = __SPREADS__;
  const CARDS = __CARDS__;
  const STORAGE_KEY = "mystic_tarot_readings";
  const MAX_HISTORY = 100;
  const $ = (id) => document.getElementById(id);
  const spreadById = {};
  SPREADS.forEach((s) => { spreadById[s.id] = s; });
  let chosenSpread = "three";

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function cardsLabel(count) {
    const mod10 = count % 10;
    const mod100 = count % 100;
    let word = "карт";
    if (mod10 === 1 && mod100 !== 11) word = "карта";
    else if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) word = "карты";
    return count + " " + word;
  }

  function renderSpreads() {
    $("spreads").innerHTML = SPREADS.map((s) =>
      '<label class="radio" data-v="' + escapeHtml(s.id) + '">' +
        '<span class="dot"></span>' +
        '<span><b>' + escapeHtml(s.title) + '</b>' +
        '<small>' + escapeHtml(s.description) + ' · ' + cardsLabel(s.positions.length) + '</small></span>' +
      '</label>').join("");
    document.querySelectorAll("#spreads .radio").forEach((el) => {
      el.classList.toggle("checked", el.dataset.v === chosenSpread);
      el.onclick = () => { chosenSpread = el.dataset.v; renderSpreads(); };
    });
  }

  function cardHtml(rc, compact) {
    const c = rc.card;
    const mean = rc.reversed ? c.meaning_reversed : c.meaning_upright;
    const kw = (rc.reversed ? c.keywords_reversed : c.keywords_upright).join(", ");
    return '<div class="card">' +
      '<div class="sym">' + escapeHtml(c.symbol) + '</div>' +
      '<div class="nm">' + escapeHtml(c.name_ru) + '</div>' +
      '<div class="pos">' + escapeHtml(rc.position_name) + '</div>' +
      (rc.reversed ? '<div class="rev">перевёрнута</div>' : "") +
      (compact ? "" :
        '<div class="mean">' + escapeHtml(mean) + '</div>' +
        '<div class="kw">' + escapeHtml(kw) + '</div>') +
      '</div>';
  }

  function showReading(r, scroll) {
    const spread = spreadById[r.spread];
    const cols = r.cards.length === 1 ? "c1" : r.cards.length === 3 ? "c3" : "c10";
    const compact = r.cards.length >= 6;
    const title = spread ? spread.title : (r.spread_label || r.spread);
    $("result-box").innerHTML =
      '<div class="panel">' +
        '<h2 style="margin-top:0">Расклад<span class="badge">' + escapeHtml(title) + '</span></h2>' +
        '<div class="reading-meta">' + new Date(r.created_at).toLocaleString("ru-RU", { day: "2-digit", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" }) + '</div>' +
        (r.question ? '<div class="q">«' + escapeHtml(r.question) + '»</div>' : "") +
        '<div class="cards ' + cols + '">' + r.cards.map((rc) => cardHtml(rc, compact)).join("") + '</div>' +
      '</div>';
    if (scroll) $("result-box").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function readHistory() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      const items = JSON.parse(raw);
      return Array.isArray(items) ? items : [];
    } catch (e) {
      return [];
    }
  }

  function writeHistory(items) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items.slice(0, MAX_HISTORY))); } catch (e) {}
  }

  function loadHistory() {
    const box = $("history");
    const items = readHistory();
    if (!items.length) {
      box.innerHTML = '<p class="sub">Раскладов пока нет — откройте первую карту выше.</p>';
      return;
    }
    box.innerHTML = items.slice(0, 20).map((r) =>
      '<div class="history-item" data-id="' + escapeHtml(r.id) + '">' +
        '<div class="row"><span class="who2">' + escapeHtml(r.question || "Без вопроса") + '</span>' +
        '<span class="when">' + new Date(r.created_at).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) + '</span></div>' +
        '<small>' + escapeHtml(spreadById[r.spread] ? spreadById[r.spread].title : (r.spread_label || r.spread)) + ' · ' + cardsLabel(r.cards.length) + '</small>' +
      '</div>').join("");
    box.querySelectorAll(".history-item").forEach((el) => {
      el.onclick = () => {
        const found = readHistory().find((r) => r.id === el.dataset.id);
        if (found) showReading(found, true);
      };
    });
  }

  function newId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "r-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  }

  function drawReading() {
    const q = $("f-question").value.trim();
    const err = $("draw-error");
    err.textContent = "";
    if (q.length < 3) { err.textContent = "Опишите вопрос (минимум 3 символа)."; return; }

    const spread = spreadById[chosenSpread] || SPREADS[0];
    if (!CARDS.length || CARDS.length < spread.positions.length) {
      err.textContent = "Не удалось загрузить колоду карт.";
      return;
    }

    const deck = CARDS.slice();
    for (let i = deck.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = deck[i]; deck[i] = deck[j]; deck[j] = tmp;
    }

    const reading = {
      id: newId(),
      question: q,
      spread: spread.id,
      spread_label: spread.title,
      created_at: new Date().toISOString(),
      cards: deck.slice(0, spread.positions.length).map((card, index) => ({
        position: index + 1,
        position_name: spread.positions[index],
        reversed: Math.random() < 0.3,
        card: card,
      })),
    };

    const history = readHistory();
    history.unshift(reading);
    writeHistory(history);

    showReading(reading, true);
    $("f-question").value = "";
    $("q-count").textContent = "0";
    loadHistory();
  }

  $("f-question").addEventListener("input", () => {
    $("q-count").textContent = String($("f-question").value.length);
  });
  $("btn-draw").onclick = drawReading;

  renderSpreads();
  loadHistory();
})();
</script>
</body>
</html>
